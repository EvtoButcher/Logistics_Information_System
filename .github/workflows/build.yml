name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build (Windows, Qt 5.15.2 MinGW)
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '5.15.2'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw81'
          tools: 'tools_mingw81,qt.tools.win64_mingw810'
          cache: true

      - name: Configure
        shell: cmd
        run: |
          if not exist build mkdir build
          cd build
          qmake ..\LogisticsInformationSystem.pro -spec win32-g++ "CONFIG+=debug"

      - name: Build
        shell: cmd
        run: |
          cd build
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Build tests
        shell: cmd
        run: |
          if not exist build\tests mkdir build\tests
          cd build\tests
          qmake ..\..\tests\tests.pro -spec win32-g++ "CONFIG+=debug"
          mingw32-make -j%NUMBER_OF_PROCESSORS%

      - name: Run tests
        shell: cmd
        run: |
          cd build\tests
          debug\tst_core.exe -o test-results.txt,txt
          set TEST_EXIT=%ERRORLEVEL%
          type test-results.txt
          exit /b %TEST_EXIT%
